{% extends 'portal/base.html' %}
{% block title %}Новая заявка | GosdumaMusic{% endblock %}
{% block content %}
<header class="nav">
  <h1>Новая музыкальная заявка</h1>
  <a class="btn btn-secondary" href="{% url 'dashboard' %}">Назад в кабинет</a>
</header>
<section class="card">
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }} {{ field }}</label>
      {% if field.errors %}<small class="error-text">{{ field.errors|striptags }}</small>{% endif %}
    {% endfor %}
    <button class="btn btn-primary" type="submit">Отправить</button>
  </form>
</section>
{% endblock %}
